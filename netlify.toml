# ============================================================
# Netlify configuration for DigitalMarketing (Vite + Supabase)
# ============================================================

[build]
  # Command Netlify runs to build the project
  command = "npm run build"

  # Directory that contains the built output (Vite default)
  publish = "dist"

  # Node version — match your local environment
  environment = { NODE_VERSION = "20" }

# ── SPA redirect rule ────────────────────────────────────────
# All routes fall back to index.html so client-side routing works.
[[redirects]]
  from   = "/*"
  to     = "/index.html"
  status = 200

# ── Security headers ─────────────────────────────────────────
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options        = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy        = "strict-origin-when-cross-origin"
    Permissions-Policy     = "camera=(), microphone=(), geolocation=()"

# ── Cache static assets aggressively ─────────────────────────
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
